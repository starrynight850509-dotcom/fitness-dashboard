<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitness Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e8edf5;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:32px;margin:8px 0}h2{font-size:18px}small,.muted{color:#9ba9bc}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card,section{background:#1a2331;border:1px solid #2c394b;border-radius:14px;padding:20px;margin-bottom:16px}.big{font-size:30px;font-weight:700;margin:12px 0}.track{height:8px;background:#354254;border-radius:8px;overflow:hidden;margin:12px 0}.fill{height:100%;border-radius:8px}label{display:block;color:#aebcd0;font-size:13px}input,select,button{font:inherit;border:1px solid #3b4b61;border-radius:8px;padding:10px;background:#101824;color:#eef4ff;max-width:100%}input,select{width:100%;margin-top:5px}button{cursor:pointer;background:#9be7bd;color:#10291c;font-weight:700}button.secondary{background:#253348;color:#e8edf5}button.danger{background:transparent;color:#ffaaaa;padding:5px 9px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #334155}th{color:#aebcd0;font-size:12px}.scroll{overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{color:#9ba9bc;font-size:12px}#notice{color:#ffcf8a} @media(max-width:500px){main{padding:14px}.grid{grid-template-columns:1fr 1fr}.card{padding:12px}.big{font-size:23px}}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chart{background:#101824;border:1px solid #334155;border-radius:10px;padding:12px}.chart svg{width:100%;display:block}.chart h3{font-size:14px;margin:0 0 8px}@media(max-width:650px){.charts{grid-template-columns:1fr}}input[type=date]{color-scheme:dark}</style><main><header><div><small>TRAINING PROJECT</small><h1>Fitness Dashboard</h1><div class="muted">巨巨養成計畫 · Nutrition Tracker</div></div><div><label>紀錄日期<input id="day" type="date" required></label><div class="actions" style="margin-top:8px"><button class="secondary" id="prev">‹ 前一天</button><button class="secondary" id="today">今天</button><button class="secondary" id="next">後一天 ›</button></div></div></header><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="secondary" id="editTargets">目標設定 ⚙</button></div><div id="metrics" class="grid"></div><section id="targetPanel" hidden><h2>每日目標設定</h2><form id="targetForm"><label>總熱量 (kcal)<input id="target0" type="number" min="0.1" step="0.1" required></label><label>蛋白質 (g)<input id="target1" type="number" min="0.1" step="0.1" required></label><label>碳水 (g)<input id="target2" type="number" min="0.1" step="0.1" required></label><label>脂肪 (g)<input id="target3" type="number" min="0.1" step="0.1" required></label><button>儲存目標</button><button type="button" class="secondary" id="cancelTargets">取消</button></form><p class="muted">四項目標可獨立設定，變更會套用至所有日期及歷史圖表。</p></section><section><h2>新增飲食紀錄</h2><form id="entry"><label>餐別<select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>宵夜</option></select></label><label>蛋白質 (g)<input id="p" type="number" min="0" step="0.1" required value="0"></label><label>碳水 (g)<input id="c" type="number" min="0" step="0.1" required value="0"></label><label>脂肪 (g)<input id="f" type="number" min="0" step="0.1" required value="0"></label><label>熱量 (kcal)<input id="k" type="number" min="0" step="0.1" placeholder="自動計算"></label><button>新增紀錄</button></form><p class="muted">熱量留空時，依蛋白質 × 4 ＋ 碳水 × 4 ＋ 脂肪 × 9 計算。可輸入食品標示的實際熱量。</p></section><section><h2>當日飲食明細</h2><div class="scroll"><table><thead><tr><th>餐別</th><th>熱量</th><th>蛋白質</th><th>碳水</th><th>脂肪</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><header style="margin-bottom:8px"><h2>歷史攝取趨勢</h2><label>顯示期間<select id="period"><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option></select></label></header><p class="muted">以選定日期為截止日 · 虛線為每日目標 · 未登錄日期留空</p><div id="history" class="charts"></div></section><section><h2>資料管理</h2><div class="actions"><button id="csv" class="secondary">匯出 CSV</button><button id="backup" class="secondary">備份 JSON</button><label>還原備份<input id="restore" type="file" accept=".json"></label></div><p id="notice"></p></section><footer>每日目標可於目標設定修改。資料儲存在目前瀏覽器，請定期備份。無 AI 拍照辨識或跨裝置同步。</footer></main><script>
const $=id=>document.getElementById(id), key='fitness-dashboard-v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(data))data=[]}catch(e){$('notice').textContent='無法讀取本機紀錄'}const date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;$('day').value=date(new Date());const fields=['k','p','c','f'], targets=[2300,140,300,60],names=['總熱量','蛋白質','碳水化合物','脂肪'],colors=['#9be7bd','#70a9ff','#f5cc77','#d6a0ef'];const targetKey=key+"-targets";const validTargets=a=>Array.isArray(a)&&a.length===4&&a.every(v=>Number.isFinite(v)&&v>0);try{const a=JSON.parse(localStorage.getItem(targetKey));if(validTargets(a))targets.splice(0,4,...a)}catch(e){}function persistTargets(){try{localStorage.setItem(targetKey,JSON.stringify(targets))}catch(e){$("notice").textContent="目標儲存失敗，請匯出備份。"}}$("editTargets").onclick=()=>{targets.forEach((v,i)=>$("target"+i).value=v);$("targetPanel").hidden=false};$("cancelTargets").onclick=()=>$("targetPanel").hidden=true;$("targetForm").onsubmit=e=>{e.preventDefault();const a=targets.map((_,i)=>Number($("target"+i).value));if(!validTargets(a))return;targets.splice(0,4,...a);persistTargets();$("targetPanel").hidden=true;render()};const fmt=n=>Number(n.toFixed(1)).toLocaleString('en-US');function sum(d){return fields.map(k=>data.filter(r=>r.day===d).reduce((s,r)=>s+r[k],0))}function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){$('notice').textContent='本機儲存失敗，請立即匯出備份。'}render()}function cell(tr,v){let td=tr.insertCell();td.textContent=v;return td}function render(){let d=$('day').value,s=sum(d);$('metrics').innerHTML=s.map((v,i)=>`<div class="card"><small>${names[i]}</small><div class="big">${fmt(v)} <small>${i?'g':'kcal'}</small></div><div class="muted">目標 ${targets[i]} · ${Math.round(v/targets[i]*100)}%</div><div class="track"><div class="fill" style="width:${Math.min(100,v/targets[i]*100)}%;background:${colors[i]}"></div></div><small>${v>targets[i]?'超出':'剩餘'} ${fmt(Math.abs(targets[i]-v))}</small></div>`).join('');$('rows').replaceChildren();data.filter(r=>r.day===d).forEach(r=>{let tr=$('rows').insertRow();[r.meal,...fields.map(k=>fmt(r[k]))].forEach(v=>cell(tr,v));let b=document.createElement('button');b.textContent='刪除';b.className='danger';b.onclick=()=>{if(confirm('刪除此筆紀錄？')){data=data.filter(x=>x.id!==r.id);save()}};tr.insertCell().append(b)});if(!$('rows').rows.length){let td=$('rows').insertRow().insertCell();td.colSpan=6;td.textContent='尚無飲食紀錄'}drawHistory(d)}
function drawHistory(d){const n=+$('period').value,days=Array.from({length:n},(_,i)=>{let t=new Date(d+'T12:00:00');t.setDate(t.getDate()-n+1+i);return date(t)}), recorded=new Set(data.map(r=>r.day)), totals=days.map(ds=>recorded.has(ds)?sum(ds):null);$('history').innerHTML=fields.map((k,j)=>{let vals=totals.map(v=>v===null?null:v[j]),max=Math.max(targets[j],...vals.filter(v=>v!==null))*1.15,x=i=>52+i*350/(n-1),y=v=>170-v/max*145;let lines='',points='',last=null;vals.forEach((v,i)=>{if(v===null){last=null;return}if(last!==null)lines+=`<line x1="${x(last)}" y1="${y(vals[last])}" x2="${x(i)}" y2="${y(v)}" stroke="${colors[j]}" stroke-width="2.5"/>`;points+=`<circle cx="${x(i)}" cy="${y(v)}" r="${n>30?2:3.5}" fill="${colors[j]}"><title>${days[i]}: ${fmt(v)} ${j?'g':'kcal'}</title></circle>`;last=i});let grid=Array.from({length:5},(_,i)=>{let v=max*i/4;return `<line x1="52" x2="402" y1="${y(v)}" y2="${y(v)}" stroke="#334155"/><text x="46" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}).join('');let ticks=[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${x(i)}" y="190" text-anchor="middle">${days[i].slice(5)}</text>`).join('');return `<div class="chart"><h3 style="color:${colors[j]}">${names[j]} (${j?'g':'kcal'})</h3><svg viewBox="0 0 425 205" role="img" aria-label="${names[j]}歷史折線圖" font-size="11" fill="#9ba9bc">${grid}<line x1="52" x2="402" y1="${y(targets[j])}" y2="${y(targets[j])}" stroke="${colors[j]}" stroke-dasharray="5 4" opacity=".8"/>${lines}${points}${ticks}${vals.every(v=>v===null)?'<text x="227" y="100" text-anchor="middle">尚無紀錄</text>':''}</svg><small>每日目標：${targets[j]} ${j?'g':'kcal'}</small></div>`}).join('')}
function shiftDay(delta){let t=new Date(($('day').value||date(new Date()))+'T12:00:00');t.setDate(t.getDate()+delta);$('day').value=date(t);render()}
$('prev').onclick=()=>shiftDay(-1);$('next').onclick=()=>shiftDay(1);$('today').onclick=()=>{$('day').value=date(new Date());render()};$('period').onchange=render;
$('day').onchange=()=>{if(!$('day').value)$('day').value=date(new Date());render()};$('entry').onsubmit=e=>{e.preventDefault();if(!$('day').value)return;let p=+$('p').value,c=+$('c').value,f=+$('f').value,k=$('k').value===''?4*p+4*c+9*f:+$('k').value;data.push({id:Date.now()+'-'+Math.random(),day:$('day').value,meal:$('meal').value,p,c,f,k});save();$('entry').reset()};function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function quote(v){let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}$('csv').onclick=()=>download('fitness.csv','\ufeff'+[['日期','餐別','熱量','蛋白質','碳水','脂肪'],...data.map(r=>[r.day,r.meal,...fields.map(k=>r[k])])].map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');$('backup').onclick=()=>download('fitness-backup.json',JSON.stringify({data,targets},null,2),'application/json');$('restore').onchange=async e=>{try{let raw=JSON.parse(await e.target.files[0].text()),a=Array.isArray(raw)?raw:raw.data;if(!Array.isArray(raw)&&!validTargets(raw.targets))throw Error();if(!Array.isArray(a)||!a.every(r=>r&&typeof r.id==='string'&&typeof r.meal==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.day)&&fields.every(k=>Number.isFinite(r[k])&&r[k]>=0)))throw Error();if(confirm('以備份取代目前所有紀錄？')){data=a;if(!Array.isArray(raw)){targets.splice(0,4,...raw.targets);persistTargets()}save()}}catch(err){$('notice').textContent='備份格式不正確'}e.target.value=''};render();
</script></html>

<!DOCTYPE html>
<html lang="zh-Hant"><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Fitness Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e8edf5;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:32px;margin:8px 0}h2{font-size:18px}small,.muted{color:#9ba9bc}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card,section{background:#1a2331;border:1px solid #2c394b;border-radius:14px;padding:20px;margin-bottom:16px}.big{font-size:30px;font-weight:700;margin:12px 0}.track{height:8px;background:#354254;border-radius:8px;overflow:hidden;margin:12px 0}.fill{height:100%;border-radius:8px}label{display:block;color:#aebcd0;font-size:13px}input,select,button{font:inherit;border:1px solid #3b4b61;border-radius:8px;padding:10px;background:#101824;color:#eef4ff;max-width:100%}input,select{width:100%;margin-top:5px}button{cursor:pointer;background:#9be7bd;color:#10291c;font-weight:700}button.secondary{background:#253348;color:#e8edf5}button.danger{background:transparent;color:#ffaaaa;padding:5px 9px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #334155}th{color:#aebcd0;font-size:12px}.scroll{overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{color:#9ba9bc;font-size:12px}#notice{color:#ffcf8a} @media(max-width:500px){main{padding:14px}.grid{grid-template-columns:1fr 1fr}.card{padding:12px}.big{font-size:23px}}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chart{background:#101824;border:1px solid #334155;border-radius:10px;padding:12px}.chart svg{width:100%;display:block}.chart h3{font-size:14px;margin:0 0 8px}@media(max-width:650px){.charts{grid-template-columns:1fr}}input[type=date]{color-scheme:dark}
body{background:#0b1019;color:#e9eef8}main{max-width:1320px;padding:32px}main>header{margin-bottom:20px}h1{font-size:34px;letter-spacing:-1px} .tabs{display:flex;gap:8px;border-bottom:1px solid #29364a;margin-bottom:24px;overflow:auto}.tab{background:transparent;color:#a6b3c8;border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 22px;white-space:nowrap;text-align:left}.tab small{display:block;font-size:11px;margin-top:4px;font-weight:400}.tab.active{color:#9be7bd;border-bottom-color:#9be7bd;background:#172231}.section-title{font-size:19px;margin:0 0 16px}.card,section{background:#141e2d;border-color:#29384d;border-radius:18px}.metric{text-align:center;position:relative;padding:20px 12px}.metric svg{display:block;width:min(100%,185px);margin:8px auto}.metric .remaining{border-top:1px solid #29384d;padding-top:12px;margin-top:8px}.metric .pct{font-size:13px;font-weight:700}.chart{background:#101925;border-color:#29384d}.charts{gap:16px}.page[hidden],section[hidden]{display:none!important}#notice{min-height:1.4em}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:650px){main{padding:14px}.tab{padding:10px 12px;font-size:12px}.metric{padding:12px 6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:28px}}
 .syncbox{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid #29384d;border-radius:12px;background:#131c29}.syncline{display:flex;align-items:center;gap:8px;font-size:13px}.syncdot{width:7px;height:7px;border-radius:50%;background:#9be7bd}.syncbrand{color:#9ba9bc;font-size:11px;border-left:1px solid #354254;padding-left:8px}#lastSync{font-size:11px;margin-top:5px}.syncicon{display:grid;place-items:center;background:transparent;color:#9ba9bc;border:1px solid #354254;padding:8px;border-radius:8px}.syncicon:hover{color:#9be7bd;background:#253348}#notice:empty{display:none}</style><main><header><div><small>TRAINING PROJECT</small><h1>Fitness Dashboard</h1><div class="muted">巨巨養成計畫 · Nutrition Tracker</div></div><div class="syncbox"><div class="syncinfo"><div class="syncline"><span class="syncdot"></span><span id="syncStatus">Connecting</span><span class="syncbrand">Neon PostgreSQL</span></div><div id="lastSync" class="muted">Last Sync：—</div></div><button id="refreshDb" class="syncicon" title="重新同步資料" aria-label="重新同步資料"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button></div></header><nav aria-label="分頁" class="tabs"><button aria-selected="true" class="tab active" data-tab="0" type="button">Overview<small>營養總覽</small></button><button aria-selected="false" class="tab" data-tab="1" type="button">Nutrition Log<small>飲食紀錄</small></button><button aria-selected="false" class="tab" data-tab="2" type="button">Data Management<small>資料管理</small></button></nav><div class="page" id="page0"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px"><h2 class="section-title" style="margin:0">每日營養總覽</h2><div class="muted" id="overviewDate"></div></div><div class="grid" id="metrics"></div><section><header style="margin-bottom:8px"><h2>歷史攝取趨勢</h2><label>顯示期間<select id="period"><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option></select></label></header><p class="muted">以今天為截止日 · 虛線為每日目標 · 未登錄日期留空</p><div class="charts" id="history"></div></section></div><div class="page" hidden="" id="page1"><section><header style="margin-bottom:0"><h2>紀錄日期</h2><div><label>選擇日期<input id="day" required="" type="date"/></label><div class="actions" style="margin-top:8px"><button class="secondary" id="prev">‹ 前一天</button><button class="secondary" id="today">今天</button><button class="secondary" id="next">後一天 ›</button></div></div></header></section><section><h2>新增飲食紀錄</h2><form id="entry"><label>餐別<select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>宵夜</option></select></label><label>蛋白質 (g)<input id="p" min="0" required="" step="0.1" type="number" value="0"/></label><label>碳水 (g)<input id="c" min="0" required="" step="0.1" type="number" value="0"/></label><label>脂肪 (g)<input id="f" min="0" required="" step="0.1" type="number" value="0"/></label><label>熱量 (kcal)<input id="k" min="0" placeholder="自動計算" step="0.1" type="number"/></label><button>新增紀錄</button></form><p class="muted">熱量留空時，依蛋白質 × 4 ＋ 碳水 × 4 ＋ 脂肪 × 9 計算。可輸入食品標示的實際熱量。</p></section><section><h2>當日飲食明細</h2><div class="scroll"><table><thead><tr><th>餐別</th><th>熱量</th><th>蛋白質</th><th>碳水</th><th>脂肪</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><div class="page" hidden="" id="page2"><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="secondary" id="editTargets">目標設定 ⚙</button></div><section hidden="" id="targetPanel"><h2>每日目標設定</h2><form id="targetForm"><label>總熱量 (kcal)<input id="target0" min="0.1" required="" step="0.1" type="number"/></label><label>蛋白質 (g)<input id="target1" min="0.1" required="" step="0.1" type="number"/></label><label>碳水 (g)<input id="target2" min="0.1" required="" step="0.1" type="number"/></label><label>脂肪 (g)<input id="target3" min="0.1" required="" step="0.1" type="number"/></label><button>儲存目標</button><button class="secondary" id="cancelTargets" type="button">取消</button></form><p class="muted">四項目標可獨立設定，變更會套用至所有日期及歷史圖表。</p></section><section><h2>資料管理</h2><div class="actions"><button class="secondary" id="csv">匯出 CSV</button><button class="secondary" id="backup">備份 JSON</button><label>還原備份<input accept=".json" id="restore" type="file"/></label></div></section></div><p id="notice" role="status"></p></main><script>
const $=id=>document.getElementById(id), key='fitness-dashboard-v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(data))data=[]}catch(e){$('notice').textContent='無法讀取本機紀錄'}const date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;$('day').value=date(new Date());const fields=['k','p','c','f'], targets=[2300,140,300,60],names=['總熱量','蛋白質','碳水化合物','脂肪'],colors=['#9be7bd','#70a9ff','#f5cc77','#d6a0ef'];const targetKey=key+"-targets";const validTargets=a=>Array.isArray(a)&&a.length===4&&a.every(v=>Number.isFinite(v)&&v>0);try{const a=JSON.parse(localStorage.getItem(targetKey));if(validTargets(a))targets.splice(0,4,...a)}catch(e){}function persistTargets(){sync()}$("editTargets").onclick=()=>{targets.forEach((v,i)=>$("target"+i).value=v);$("targetPanel").hidden=false};$("cancelTargets").onclick=()=>$("targetPanel").hidden=true;$("targetForm").onsubmit=e=>{e.preventDefault();const a=targets.map((_,i)=>Number($("target"+i).value));if(!validTargets(a))return;targets.splice(0,4,...a);persistTargets();$("targetPanel").hidden=true;render()};const fmt=n=>Number(n.toFixed(1)).toLocaleString('en-US');function sum(d){return fields.map(k=>data.filter(r=>r.day===d).reduce((s,r)=>s+r[k],0))}let revision=0,csrf='',ready=false,queue=Promise.resolve(),failed=false,dirty=false,pending=0;
function status(v){document.querySelector(".syncdot").style.background=v==="Connected"?"#9be7bd":v==="Disconnected"?"#ffaaaa":"#ffcf8a";$("syncStatus").textContent=v;$("syncStatus").style.color=v==="Connected"?"#9be7bd":v==="Disconnected"?"#ffaaaa":"#ffcf8a"}function stamp(){ $("lastSync").textContent="Last Sync："+new Date().toLocaleString("zh-TW"); }
function sync(){if(!ready)return;dirty=true;pending++;status("Syncing");const snapshot=JSON.stringify({data,targets});queue=queue.then(async()=>{try{if(failed)return;const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({...JSON.parse(snapshot),revision})});const x=await r.json();if(!r.ok)throw Error(x.error);revision=x.revision;stamp();$('notice').textContent=''}catch(e){failed=true;status('Disconnected');$('notice').textContent='儲存失敗：'+e.message+'。請先備份 JSON，再重新整理。'}finally{pending--;if(!pending&&!failed){dirty=false;status('Connected')}}})}
function save(){sync();render()}
function cell(tr,v){let td=tr.insertCell();td.textContent=v;return td}function render(){let d=$('day').value,todayDate=date(new Date()),s=sum(todayDate);$('overviewDate').textContent=todayDate.replaceAll('-','/')+' · 今天';$('metrics').innerHTML=s.map((v,i)=>{const pct=v/targets[i]*100,unit=i?'g':'kcal',circ=2*Math.PI*56;return `<div class="card metric"><div style="color:${colors[i]};font-weight:700">${names[i]}</div><svg viewBox="0 0 150 150" role="img" aria-label="${names[i]} ${Math.round(pct)}%"><circle cx="75" cy="75" r="56" fill="none" stroke="#29384d" stroke-width="9"/><circle cx="75" cy="75" r="56" fill="none" stroke="${colors[i]}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.min(100,pct)/100*circ} ${circ}" transform="rotate(-90 75 75)" opacity="${pct>0?1:0}"/><text x="75" y="73" text-anchor="middle" fill="#e9eef8" font-size="23" font-weight="700">${fmt(v)}</text><text x="75" y="91" text-anchor="middle" fill="#9ba9bc" font-size="11">/ ${fmt(targets[i])} ${unit}</text></svg><div class="pct" style="color:${colors[i]}">${Math.round(pct)}% 達成</div><div class="remaining muted">${v>targets[i]?'超出':'剩餘'} ${fmt(Math.abs(targets[i]-v))} ${unit}</div></div>`}).join('');$('rows').replaceChildren();data.filter(r=>r.day===d).forEach(r=>{let tr=$('rows').insertRow();[r.meal,...fields.map(k=>fmt(r[k]))].forEach(v=>cell(tr,v));let b=document.createElement('button');b.textContent='刪除';b.className='danger';b.onclick=()=>{if(confirm('刪除此筆紀錄？')){data=data.filter(x=>x.id!==r.id);save()}};tr.insertCell().append(b)});if(!$('rows').rows.length){let td=$('rows').insertRow().insertCell();td.colSpan=6;td.textContent='尚無飲食紀錄'}drawHistory(todayDate)}
function drawHistory(d){const n=+$('period').value,days=Array.from({length:n},(_,i)=>{let t=new Date(d+'T12:00:00');t.setDate(t.getDate()-n+1+i);return date(t)}), recorded=new Set(data.map(r=>r.day)), totals=days.map(ds=>recorded.has(ds)?sum(ds):null);$('history').innerHTML=fields.map((k,j)=>{let vals=totals.map(v=>v===null?null:v[j]),max=Math.max(targets[j],...vals.filter(v=>v!==null))*1.15,x=i=>52+i*350/(n-1),y=v=>170-v/max*145;let lines='',points='',last=null;vals.forEach((v,i)=>{if(v===null){last=null;return}if(last!==null)lines+=`<line x1="${x(last)}" y1="${y(vals[last])}" x2="${x(i)}" y2="${y(v)}" stroke="${colors[j]}" stroke-width="2.5"/>`;points+=`<circle cx="${x(i)}" cy="${y(v)}" r="${n>30?2:3.5}" fill="${colors[j]}"><title>${days[i]}: ${fmt(v)} ${j?'g':'kcal'}</title></circle>`;last=i});let grid=Array.from({length:5},(_,i)=>{let v=max*i/4;return `<line x1="52" x2="402" y1="${y(v)}" y2="${y(v)}" stroke="#334155"/><text x="46" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}).join('');let ticks=[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${x(i)}" y="190" text-anchor="middle">${days[i].slice(5)}</text>`).join('');return `<div class="chart"><h3 style="color:${colors[j]}">${names[j]} (${j?'g':'kcal'})</h3><svg viewBox="0 0 425 205" role="img" aria-label="${names[j]}歷史折線圖" font-size="11" fill="#9ba9bc">${grid}<line x1="52" x2="402" y1="${y(targets[j])}" y2="${y(targets[j])}" stroke="${colors[j]}" stroke-dasharray="5 4" opacity=".8"/>${lines}${points}${ticks}${vals.every(v=>v===null)?'<text x="227" y="100" text-anchor="middle">尚無紀錄</text>':''}</svg><small>每日目標：${targets[j]} ${j?'g':'kcal'}</small></div>`}).join('')}
function shiftDay(delta){let t=new Date(($('day').value||date(new Date()))+'T12:00:00');t.setDate(t.getDate()+delta);$('day').value=date(t);render()}
$('prev').onclick=()=>shiftDay(-1);$('next').onclick=()=>shiftDay(1);$('today').onclick=()=>{$('day').value=date(new Date());render()};$('period').onchange=render;
$('day').onchange=()=>{if(!$('day').value)$('day').value=date(new Date());render()};$('entry').onsubmit=e=>{e.preventDefault();if(!$('day').value)return;let p=+$('p').value,c=+$('c').value,f=+$('f').value,k=$('k').value===''?4*p+4*c+9*f:+$('k').value;data.push({id:Date.now()+'-'+Math.random(),day:$('day').value,meal:$('meal').value,p,c,f,k});save();$('entry').reset()};function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function quote(v){let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}$('csv').onclick=()=>download('fitness.csv','\ufeff'+[['日期','餐別','熱量','蛋白質','碳水','脂肪'],...data.map(r=>[r.day,r.meal,...fields.map(k=>r[k])])].map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');$('backup').onclick=()=>download('fitness-backup.json',JSON.stringify({data,targets},null,2),'application/json');$('restore').onchange=async e=>{try{let raw=JSON.parse(await e.target.files[0].text()),a=Array.isArray(raw)?raw:raw.data;if(!Array.isArray(raw)&&!validTargets(raw.targets))throw Error();if(!Array.isArray(a)||!a.every(r=>r&&typeof r.id==='string'&&typeof r.meal==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.day)&&fields.every(k=>Number.isFinite(r[k])&&r[k]>=0)))throw Error();if(confirm('以備份取代目前所有紀錄？')){data=a;if(!Array.isArray(raw)){targets.splice(0,4,...raw.targets);}save()}}catch(err){$('notice').textContent='備份格式不正確'}e.target.value=''};

async function refreshDb(){
const controls=[...document.querySelectorAll('button,input,select')];controls.forEach(e=>e.disabled=true);status('Syncing');await queue;
if(dirty&&!confirm('有尚未同步的修改。建議先取消並備份 JSON。確定要捨棄本機修改並重新讀取 Neon？')){controls.forEach(e=>e.disabled=false);status('Disconnected');return;}
try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('無法載入資料');const x=await r.json();if(!Array.isArray(x.data)||!validTargets(x.targets))throw Error('資料格式錯誤');data=x.data;targets.splice(0,4,...x.targets);revision=x.revision;csrf=x.csrf;ready=true;failed=false;dirty=false;render();status('Connected');stamp();$('notice').textContent=''}catch(e){status('Disconnected');$('notice').textContent=e.message+'，請重試同步'}finally{document.querySelectorAll('button,input,select').forEach(e=>e.disabled=!ready);$('refreshDb').disabled=false;}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>{const active=x===t;x.classList.toggle('active',active);x.setAttribute('aria-selected',String(active));$('page'+x.dataset.tab).hidden=!active;});render();});
$('refreshDb').onclick=refreshDb;refreshDb();
</script></html>
